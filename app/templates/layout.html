<!DOCTYPE html>
<html lang="{{ lang or 'ru' }}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ content.page_title if content is defined else "FinTechAnalytics" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=4" />
    {% block extra_head %}{% endblock %}
</head>
<body class="home">
    <div class="page">
        <header class="topbar">
            <div class="container topbar__inner">
                <a href="{{ url_for('read_root') }}?lang={{ lang }}" class="brand-link"><span class="brand-text">{{ nav.brand }}</span></a>
                <nav class="topbar__nav">
                    <a href="{{ url_for('read_root') }}?lang={{ lang }}" class="nav-link">{{ nav.home }}</a>
                    <a href="{{ url_for('show_form') }}?lang={{ lang }}" class="nav-link">{{ nav.predict }}</a>
                    {% if user %}
                        <a href="{{ url_for('account_dashboard') }}?lang={{ lang }}" class="nav-link">{{ nav.account }}</a>
                        <form action="{{ url_for('logout') }}?lang={{ lang }}" method="post" class="nav-inline-form">
                            <button type="submit" class="nav-link nav-link--action">{{ nav.logout }}</button>
                        </form>
                    {% else %}
                        <a href="{{ url_for('login_page') }}?lang={{ lang }}" class="nav-link">{{ nav.login }}</a>
                        <a href="{{ url_for('register_page') }}?lang={{ lang }}" class="nav-link nav-link--primary">{{ nav.register }}</a>
                    {% endif %}
                </nav>
            </div>
        </header>

        {% block content %}{% endblock %}
    </div>
    <script src="/static/js/app.js?v=20260118_5" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
