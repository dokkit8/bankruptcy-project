{% extends "layout.html" %}

{% block content %}
<main class="container auth">
    <div class="auth-card">
        <h1>Регистрация</h1>
        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}
        <form action="/register?lang={{ lang }}" method="post" class="auth-form">
            <label>Email</label>
            <input type="email" name="email" required placeholder="you@example.com" />
            <label>Пароль</label>
            <div class="password-field">
                <input type="password" name="password" id="register-password" required minlength="8" autocomplete="new-password" />
                <button type="button" class="password-toggle" aria-label="Показать пароль" data-target="register-password">👁</button>
            </div>
            <button type="submit" class="cta">Создать аккаунт</button>
        </form>
        <p class="auth-switch">Уже есть аккаунт? <a href="/login?lang={{ lang }}">Войти</a></p>
    </div>
</main>
{% endblock %}
